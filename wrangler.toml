# Deployment config for Workers Builds.
# Runtime credentials stay in the Cloudflare dashboard, not in this file.
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

# UTC. Keep aligned with src/index.js scheduled().
# */1 * * * *  offline-node and resource alerts; Globalping outbound runs inside this cron every 5 minutes
# 0 * * * *    hourly combined tasks
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cf-server-monitor-db"
database_id = "11f7480a-f419-4066-b9f4-21359e150770"

[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]
